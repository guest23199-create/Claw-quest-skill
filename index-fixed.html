<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Claw Quest V12 — Sinh Tồn Trên Đảo (FIX)</title>
<!-- v=20260701.01-FIXED -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0a1628;color:#fff}
#game-wrap{position:absolute;top:44px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#game-wrap canvas{display:block;image-rendering:pixelated;background:#0a0a1a;max-width:100%;max-height:100%}
#ui-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#ui-overlay>*{pointer-events:auto}
#top-bar{position:fixed;top:0;left:0;right:0;height:40px;background:rgba(8,16,30,0.97);display:flex;align-items:center;padding:0 8px;gap:6px;border-bottom:3px solid #0c1830;z-index:20}
#resources{position:fixed;bottom:150px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:15}
#resources .rpill{display:flex;align-items:center;gap:3px;background:#16243e;border:2px solid #0a1424;border-radius:14px;padding:4px 8px;font-size:10px}
#resources .rpill span{font-weight:bold;color:#fff}
#bottom-actions{position:fixed;bottom:60px;right:8px;display:flex;flex-direction:column;gap:3px;background:#0e1830;padding:5px;border-radius:8px;z-index:18}
.bot-btn{background:#1a2c48;border:2px solid #3a5a8a;color:#fff;padding:6px 8px;border-radius:6px;font-size:10px;cursor:pointer;transition:all 0.12s}
.bot-btn:hover{background:#243a5c;border-color:#5a85c5}
#dpad{position:fixed;bottom:50px;left:8px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#1c2e4e,#0e1830);border:3px solid #0a1424;z-index:20;display:flex;align-items:center;justify-content:center}
#toast{position:fixed;top:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.88);border:1px solid rgba(255,215,0,0.3);border-radius:10px;padding:8px 16px;z-index:200;display:none;color:#fff;font-size:11px;text-align:center}
#sprite-loader{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;background:rgba(0,0,0,0.95);padding:30px 40px;border-radius:16px;border:2px solid #f0c060;text-align:center}
#loader-title{font-size:28px;margin-bottom:8px}
#loader-text{color:#f0c060;font-weight:bold;font-size:16px;margin-bottom:6px}
#loader-status{color:#8899bb;font-size:12px;margin-top:8px}
#loader-progress{width:200px;height:8px;background:#0a1424;border:1px solid #3a5a8a;border-radius:4px;margin:12px auto;overflow:hidden}
#loader-bar{height:100%;background:#2ecc71;width:0%;transition:width 0.3s}
</style>
</head>
<body>
<div id="game-wrap"></div>

<div id="ui-overlay">
  <div id="sprite-loader">
    <div id="loader-title">⚔️</div>
    <div id="loader-text">Claw Quest V12</div>
    <div id="loader-status">⏳ Đang tải...</div>
    <div id="loader-progress"><div id="loader-bar"></div></div>
    <button onclick="location.reload()" style="background:#f0c060;color:#000;padding:8px 20px;border-radius:6px;font-size:12px;font-weight:bold;border:none;cursor:pointer;margin-top:12px">↺ Tải Lại</button>
  </div>

  <div id="top-bar">
    <span style="color:#ffd060;font-size:12px;font-weight:bold;min-width:120px">🧑 <span id="hud-name">Nhà Thám Hiểm</span></span>
    <span style="color:#fff;font-size:10px;flex:1">❤️ <span id="hud-hp">20</span>/<span id="hud-maxhp">20</span></span>
    <span style="color:#fff;font-size:10px;flex:1">🍗 <span id="hud-hunger">80</span>/<span id="hud-maxhunger">100</span></span>
  </div>

  <div id="resources">
    <div class="rpill">🪵 <span id="r-wood">5</span></div>
    <div class="rpill">🪨 <span id="r-stone">3</span></div>
    <div class="rpill">🍎 <span id="r-food">3</span></div>
    <div class="rpill">🪙 <span id="r-gold">0</span></div>
  </div>

  <div id="bottom-actions">
    <button class="bot-btn" onclick="window.quickDig()">🪓 Đào +1</button>
    <button class="bot-btn" onclick="window.quickFruit()">🍎 Quả +1</button>
    <button class="bot-btn" onclick="window.quickHeal()">💊 Hồi HP</button>
    <button class="bot-btn" onclick="window.openInfo()">ℹ️ Info</button>
  </div>

  <div id="dpad">📱</div>
  <div id="toast"></div>
</div>

<script>
// ─── GAME STATE ───
const GS = {
  player: {
    name: "Adventurer",
    hp: 20,
    maxHp: 20,
    hunger: 80,
    maxĐói: 100,
    level: 1,
  },
  resources: {
    wood: 5,
    stone: 3,
    food: 3,
    gold: 0,
  },
};

window.GS = GS;

// ─── UPDATE HUD ───
function updateHUD() {
  document.getElementById("r-wood").textContent = GS.resources.wood;
  document.getElementById("r-stone").textContent = GS.resources.stone;
  document.getElementById("r-food").textContent = GS.resources.food;
  document.getElementById("r-gold").textContent = GS.resources.gold;
  document.getElementById("hud-hp").textContent = GS.player.hp;
  document.getElementById("hud-hunger").textContent = GS.player.hunger;
}

function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 2000);
}

// ─── ACTION BUTTONS ───
window.quickDig = function() {
  GS.resources.stone += 1;
  GS.player.hunger -= 2;
  updateHUD();
  showToast("🪨 Đào được đá! Đói -2");
};

window.quickFruit = function() {
  GS.resources.food += 1;
  updateHUD();
  showToast("🍎 Tìm được quả! +1");
};

window.quickHeal = function() {
  if(GS.resources.food >= 1) {
    GS.resources.food -= 1;
    GS.player.hp = GS.player.maxHp;
    updateHUD();
    showToast("💊 Ăn quả xong! Hồi đầy HP!");
  } else {
    showToast("❌ Không có quả để ăn!");
  }
};

window.openInfo = function() {
  alert("🎮 Claw Quest V12 - Phiên bản sửa lỗi\n\n" +
    "Level: " + GS.player.level + "\n" +
    "HP: " + GS.player.hp + "/" + GS.player.maxHp + "\n" +
    "Đói: " + GS.player.hunger + "/" + GS.player.maxĐói + "\n\n" +
    "Chức năng: 🪓 Đào, 🍎 Quả, 💊 Hồi HP");
};

// ─── LOADER ───
let loadProgress = 0;
const progressBar = document.getElementById("loader-bar");

function updateProgress(percent) {
  loadProgress = Math.min(percent, 100);
  if(progressBar) progressBar.style.width = loadProgress + "%";
}

function hideLoader() {
  const loader = document.getElementById("sprite-loader");
  if(loader) {
    loader.style.opacity = "0";
    loader.style.transition = "opacity 0.5s ease-out";
    setTimeout(() => {
      loader.style.display = "none";
      document.getElementById("game-wrap").style.display = "flex";
    }, 500);
  }
}

// ─── INIT ───
window.addEventListener("load", () => {
  console.log("✅ Page loaded!");
  updateProgress(30);
  
  setTimeout(() => {
    updateProgress(60);
    document.getElementById("loader-status").textContent = "⏳ Khởi tạo game...";
  }, 500);
  
  setTimeout(() => {
    updateProgress(100);
    document.getElementById("loader-status").textContent = "✅ Sẵn sàng chơi!";
    updateHUD();
    hideLoader();
  }, 1500);
});

// Global error handler
window.onerror = function(msg, url, line) {
  console.error("ERROR:", msg);
  document.getElementById("sprite-loader").innerHTML = 
    '<div style="font-size:32px;margin-bottom:10px">❌</div>' +
    '<div style="color:#ff6b6b;font-weight:bold;font-size:16px">Lỗi!</div>' +
    '<div style="color:#8899bb;font-size:11px;margin-top:8px">' + msg.substring(0,100) + '</div>' +
    '<div style="margin-top:12px"><button onclick="location.reload()" style="background:#f0c060;color:#000;padding:8px 20px;border-radius:6px;font-size:12px;cursor:pointer">↺ Tải Lại</button></div>';
  return true;
};

console.log("🎮 Claw Quest V12 - Game đã sẵn sàng!");
</script>
</body>
</html>
