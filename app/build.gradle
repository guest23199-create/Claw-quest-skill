plugins {
    id 'com.android.application'
}

android {
    namespace 'clawquest.game'
    compileSdk 34

    defaultConfig {
        applicationId 'clawquest.game'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.4-offline'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
